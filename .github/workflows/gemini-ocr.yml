name: Gemini OCR Automation

on:
  push:
    paths:
      - 'img_tmp/**' # Uruchamia się automatycznie po dodaniu plików do img_tmp

# Wymuszenie strefy czasowej dla całej maszyny wirtualnej GitHub
env:
  TZ: Europe/Warsaw

jobs:
  run-ocr:
    runs-on: ubuntu-latest
    steps:
    - name: Sprawdzenie kodu repozytorium
      uses: actions/checkout@v4
      with:
        persist-credentials: true

    - name: Konfiguracja Pythona
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalacja bibliotek
      run: |
        python -m pip install --upgrade pip
        pip install google-genai Pillow

    - name: Uruchomienie skryptu OCR
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: python ocr_script.py

    - name: Zapisanie zmian w repozytorium (TXT i HTML)
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@://github.com'
        
        git add index.html
        if [ -f odczyty24h.txt ]; then git add odczyty24h.txt; fi
        
        git diff --quiet && git diff --staged --quiet || (git commit -m "Automatyczna aktualizacja odczytów oraz strony index.html" && git push)
