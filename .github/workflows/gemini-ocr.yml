name: Gemini OCR Automation

on:
  push:
    paths:
      - 'images/**' # Skrypt uruchomi się tylko, gdy dodasz coś do folderu 'images'

jobs:
  run-ocr:
    runs-on: ubuntu-latest
    steps:
    - name: Sprawdzenie kodu repozytorium
      uses: actions/checkout@v4

    - name: Konfiguracja Pythona
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalacja bibliotek
      run: |
        python -m pip install --upgrade pip
        pip install google-genai

    - name: Uruchomienie skryptu OCR
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: python ocr_script.py

    - name: Zapisanie zmian (jeśli skrypt tworzy pliki tekstowe)
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@://github.com'
        git add .
        git diff --quiet && git diff --staged --quiet || (git commit -m "Automatyczny OCR przez Gemini" && git push)
