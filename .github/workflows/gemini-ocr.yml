name: Gemini OCR Automation

on:
  push:
    paths:
      - 'img_tmp/**' # Uruchamia się tylko po dodaniu plików do img_tmp

jobs:
  run-ocr:
    runs-on: ubuntu-latest
    steps:
    - name: Sprawdzenie kodu repozytorium
      uses: actions/checkout@v4
      with:
        persist-credentials: true # Wymagane do wykonania git push

    - name: Konfiguracja Pythona
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalacja bibliotek
      run: |
        python -m pip install --upgrade pip
        pip install google-genai Pillow

    - name: Uruchomienie skryptu OCR
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: python ocr_script.py

    - name: Zapisanie zmian w odczyty24h.txt
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@://github.com'
        git add odczyty24h.txt
        # Zatwierdź i wyślij zmiany tylko jeśli plik się zmienił
        git diff --quiet && git diff --staged --quiet || (git commit -m "Automatyczna aktualizacja odczytów licznika" && git push)
