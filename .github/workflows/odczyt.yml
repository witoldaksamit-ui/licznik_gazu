name: Odczyt licznika
on:
  push:
    paths:
      - 'img_tmp/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  odczyt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install google-genai pillow
      - run: python odczyt.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add odczyty.txt
          git diff --staged --quiet || git commit -m "Nowy odczyt licznika"
          git push
