<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Podgląd Licznika Gazu</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }
        h1 { color: #333; font-size: 24px; margin-bottom: 10px; }
        .status { color: #666; font-size: 14px; margin-bottom: 20px; }
        .timestamp { font-weight: bold; color: #2c3e50; }
        .odczyt { font-size: 32px; font-weight: bold; color: #27ae60; background: #e8f8f5; padding: 10px; border-radius: 10px; margin: 20px 0; letter-spacing: 2px; }
        img { max-width: 100%; height: auto; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
    </style>
</head>
<body>
    <div class="container">
        <h1>Bieżący Stan Licznika</h1>
        <div class="status">Ostatnia aktualizacja danych:<br><span class="timestamp">2026-10-25 09:02:19</span></div>
        <div class="odczyt">BŁĄD_MODELU m³</div>
        <h3>Aktualne zdjęcie z gazomierza:</h3>
        <img src="img_tmp/alg.jpg?t=1792915339" alt="Zdjęcie licznika">
    </div>
</body>
</html>
