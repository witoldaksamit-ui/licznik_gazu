<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VelvetHome</title>
<link rel="icon" type="image/png" href="https://witoldaksamit-ui.github.io/velvethome.github.io/thermometer.png">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
<style>
:root {
  /* Paleta bazowa Material 3 z Color.kt / Theme.kt aplikacji (bez dynamic color) */
  --bg:#FFFBFE; --card:#F3EDF7; --text:#1C1B1F; --muted:#49454F; --line:#CAC4D0;
  --primary:#6650a4; --on-primary:#FFFFFF; --chip:#E8DEF8;
  --home:#1976d2; --out:#d32f2f; --gas:#27ae60; --flow:#e67e22;
  --warn-bg:#fef5e7; --warn:#b9770e;
}
@media (prefers-color-scheme: dark) {
  :root { --bg:#1C1B1F; --card:#2B2930; --text:#E6E1E5; --muted:#CAC4D0; --line:#49454F;
          --primary:#D0BCFF; --on-primary:#381E72; --chip:#4A4458;
          --home:#64b5f6; --out:#ef7b7b; --gas:#4cc38a; --flow:#f0a05a;
          --warn-bg:#3a2e17; --warn:#f0c070; }
}
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--text); font-family:Roboto, system-ui, -apple-system, "Segoe UI", Arial, sans-serif; }
header { padding:16px 20px; font-size:22px; font-weight:500; background:var(--bg); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:5; }
main { max-width:720px; margin:0 auto; padding:16px; display:grid; gap:16px; }
.card { background:var(--card); border-radius:20px; padding:18px; box-shadow:0 1px 3px rgba(0,0,0,.08); }
h2 { margin:0 0 4px; font-size:16px; font-weight:600; }
h3 { margin:18px 0 6px; font-size:14px; font-weight:500; color:var(--muted); }
.sub { color:var(--muted); font-size:13px; }
.tiles { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
.tile { border-radius:16px; padding:12px; background:var(--bg); text-align:center; }
.tile .lbl { font-size:12px; color:var(--muted); }
.tile .val { font-size:24px; font-weight:700; margin-top:4px; }
.tile .when { font-size:11px; color:var(--muted); margin-top:2px; }
.chips { display:flex; gap:8px; margin:10px 0; }
.chip { border:0; border-radius:999px; padding:7px 14px; background:var(--chip); color:var(--text); font-size:13px; cursor:pointer; }
.chip.active { background:var(--primary); color:var(--on-primary); }
.chart { position:relative; height:200px; }
.stats { font-size:12px; color:var(--muted); margin:6px 0 2px; }
.ok { font-size:13px; color:var(--gas); background:var(--chip); padding:8px 10px; border-radius:10px; margin:10px 0; }
.usage { display:flex; justify-content:space-between; align-items:baseline; background:var(--bg); border-radius:14px; padding:12px 14px; margin:10px 0; }
.usage b { font-size:22px; color:var(--flow); }
.uwaga { font-size:13px; color:var(--warn); background:var(--warn-bg); padding:8px 10px; border-radius:10px; margin:10px 0; }
img { max-width:100%; height:auto; border-radius:12px; display:block; }
</style>
</head>
<body>
<header>VelvetHome</header>
<main>
  <section class="card">
    <div class="tiles">
      <div class="tile"><div class="lbl">Dom</div><div class="val" id="nowHome" style="color:var(--home)">–</div><div class="when" id="whenHome"></div></div>
      <div class="tile"><div class="lbl">Dwór</div><div class="val" id="nowOut" style="color:var(--out)">–</div><div class="when" id="whenOut"></div></div>
      <div class="tile"><div class="lbl">Gaz</div><div class="val" style="color:var(--gas)">__VALUE__</div><div class="when">m³ · __TIMESTAMP__</div></div>
    </div>
  </section>

  <section class="card">
    <h2>Temperatura</h2>
    <div class="chips">
      <button class="chip" data-h="6">6 h</button>
      <button class="chip" data-h="12">12 h</button>
      <button class="chip" data-h="24">24 h</button>
    </div>
    <h3>Dom</h3>
    <div class="chart"><canvas id="chHome"></canvas></div>
    <div class="stats" id="stHome"></div>
    <h3>Dwór</h3>
    <div class="chart"><canvas id="chOut"></canvas></div>
    <div class="stats" id="stOut"></div>
  </section>

  <section class="card">
    <h2>Licznik gazu</h2>
    <div class="sub">Ostatnia aktualizacja: __TIMESTAMP__</div>
    __STATUS__
    <div class="usage"><span class="sub">Zużycie gazu w ostatnich 24 h</span><b>__USAGE24__ m³</b></div>
    <h3>Aktualne zdjęcie z gazomierza</h3>
    <img src="__IMG_SRC__" alt="Zdjęcie licznika">
    <h3>Skumulowany stan licznika (m³)</h3>
    <div class="chart"><canvas id="gasStateChart"></canvas></div>
    <h3>Chwilowe zużycie gazu pomiędzy odczytami (Δ m³)</h3>
    <div class="chart"><canvas id="gasDiffChart"></canvas></div>
  </section>
</main>

<script>
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const grid = css('--line'), tick = css('--muted');

// ---------- GAZ (dane wstawiane przez ocr_script.py) ----------
function gasChart(id, labels, data, color, zero, unit) {
  new Chart(document.getElementById(id), {
    type: 'line',
    data: { labels, datasets: [{ data, borderColor: color, backgroundColor: color + '14', borderWidth: 2, tension: 0.1, fill: true, pointRadius: 0, pointHoverRadius: 0 }] },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } },
      scales: { x: { ticks: { color: tick, maxTicksLimit: 8 }, grid: { color: grid } },
                y: { beginAtZero: zero, ticks: { color: tick, callback: v => v + unit }, grid: { color: grid } } } }
  });
}
gasChart('gasStateChart', __STATE_LABELS__, __STATE_VALUES__, css('--gas'), false, '');
gasChart('gasDiffChart', __DIFF_LABELS__, __DIFF_VALUES__, css('--flow'), true, ' m³');

// ---------- TEMPERATURA (pobierana z repo velvethome.github.io) ----------
const TEMP_URL = 'https://raw.githubusercontent.com/witoldaksamit-ui/velvethome.github.io/main/temperatures.txt';
const hhmm = t => new Date(t).toLocaleTimeString('pl-PL', { hour: '2-digit', minute: '2-digit' });
let points = [], hours = 24;
try { hours = Number(localStorage.getItem('range')) || 24; } catch (e) {}

function parseTs(s) {
  let d = Date.parse(s);
  if (isNaN(d)) d = Date.parse(s.replace(' ', 'T'));
  if (isNaN(d)) { const n = Number(s); if (!isNaN(n)) d = n > 1e12 ? n : n * 1000; }
  return d;
}
function parse(text) {
  const out = [];
  for (const raw of text.split(/\r?\n/)) {
    const p = raw.trim().split(/[,\t]/).map(s => s.trim());
    if (p.length < 3 || raw.startsWith('#')) continue;
    const t = parseTs(p[0]), h = parseFloat(p[1]), o = parseFloat(p[2]);
    if (!isNaN(t)) out.push({ t, h: isNaN(h) ? null : h, o: isNaN(o) ? null : o });
  }
  return out.sort((a, b) => a.t - b.t);
}

function tempChart(id, color) {
  return new Chart(document.getElementById(id), {
    type: 'line',
    data: { datasets: [{ data: [], borderColor: color, backgroundColor: color + '14', borderWidth: 2, tension: 0.2, fill: true, pointRadius: 0, pointHoverRadius: 4 }] },
    options: { responsive: true, maintainAspectRatio: false, parsing: false, animation: false,
      interaction: { mode: 'nearest', axis: 'x', intersect: false },
      plugins: { legend: { display: false }, tooltip: { callbacks: {
        title: i => new Date(i[0].parsed.x).toLocaleString('pl-PL'),
        label: i => i.parsed.y.toFixed(1) + ' °C' } } },
      scales: { x: { type: 'linear', ticks: { color: tick, maxTicksLimit: 6, callback: v => hhmm(v) }, grid: { color: grid } },
                y: { ticks: { color: tick, callback: v => v + '°' }, grid: { color: grid } } } }
  });
}
const chHome = tempChart('chHome', css('--home')), chOut = tempChart('chOut', css('--out'));

function show(chart, key, statsId) {
  const now = Date.now(), from = now - hours * 3600000;
  const pts = points.filter(p => p.t >= from && p[key] !== null).map(p => ({ x: p.t, y: p[key] }));
  chart.data.datasets[0].data = pts;
  chart.options.scales.x.min = from; chart.options.scales.x.max = now;
  chart.update();
  const el = document.getElementById(statsId);
  if (!pts.length) { el.textContent = 'Brak danych w wybranym zakresie'; return; }
  const v = pts.map(p => p.y);
  el.textContent = `min ${Math.min(...v).toFixed(1)}° · max ${Math.max(...v).toFixed(1)}° · śr. ${(v.reduce((a, b) => a + b, 0) / v.length).toFixed(1)}°`;
}
function redraw() {
  document.querySelectorAll('.chip').forEach(b => b.classList.toggle('active', Number(b.dataset.h) === hours));
  show(chHome, 'h', 'stHome'); show(chOut, 'o', 'stOut');
}
document.querySelectorAll('.chip').forEach(b => b.addEventListener('click', () => {
  hours = Number(b.dataset.h);
  try { localStorage.setItem('range', hours); } catch (e) {}
  redraw();
}));

function latest(key) { for (let i = points.length - 1; i >= 0; i--) if (points[i][key] !== null) return points[i]; return null; }
function tiles() {
  for (const [key, valId, whenId] of [['h', 'nowHome', 'whenHome'], ['o', 'nowOut', 'whenOut']]) {
    const p = latest(key);
    document.getElementById(valId).textContent = p ? p[key].toFixed(1) + '°' : '–';
    document.getElementById(whenId).textContent = p ? hhmm(p.t) : 'brak danych';
  }
}
redraw();
fetch(TEMP_URL + '?ts=' + Date.now(), { cache: 'no-store' })
  .then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
  .then(txt => { points = parse(txt); tiles(); redraw(); })
  .catch(() => { document.getElementById('stHome').textContent = document.getElementById('stOut').textContent = 'Nie udało się pobrać danych temperatury'; });

// Odświeżanie co 60 s (z omijaniem cache)
setTimeout(() => { window.location.href = window.location.pathname + '?t=' + Date.now(); }, 60000);
</script>
</body>
</html>
